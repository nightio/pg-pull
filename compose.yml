services:
    target:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: app
            POSTGRES_PASSWORD: secret
            POSTGRES_DB: app
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
            interval: 1s
            timeout: 3s
            retries: 30
